schema_version: 1
name: routing_classical
config_path: experiments/base_config.json
fixed:
  task_generation_method: from_to_table
  task_dispatch_mode: batch
  dispatch_interval: 5
  max_safe_distance: 0.8
  enable_logging: false
  enable_event_record: false
  collect_periodic_stats: true
  strict_map_validation: true
  enable_area_admission: false
  water_level_areas: []
  routing_dispatch_cost_mode: static_dijkstra
  routing_performance_enabled: true
  routing_performance_sample_limit: 50000
matrix:
  product:
  - scenario
  - routing
  axes:
    scenario:
    - id: s100_off
      labels:
        scene: S100
        oht: 100
        load_tph: 2400
        area_policy: false
      params:
        filepath: experiments/maps/small_100.xlsx
        oht_nums: 100
        area_control_policy: 'off'
        water_level_area_filepath: null
    - id: s100_hold
      labels:
        scene: S100
        oht: 100
        load_tph: 2400
        area_policy: hold
      params:
        filepath: experiments/maps/small_100.xlsx
        oht_nums: 100
        area_control_policy: fixed_water_level_hold
        water_level_area_filepath: experiments/areas/small_100_areas.xlsx
    - id: s100_rebalance
      labels:
        scene: S100
        oht: 100
        load_tph: 2400
        area_policy: rebalance
      params:
        filepath: experiments/maps/small_100.xlsx
        oht_nums: 100
        area_control_policy: fixed_water_level_rebalance
        water_level_area_filepath: experiments/areas/small_100_areas.xlsx
    - id: s150_off
      labels:
        scene: S150
        oht: 150
        load_tph: 3120
        area_policy: false
      params:
        filepath: experiments/maps/small_150.xlsx
        oht_nums: 150
        area_control_policy: 'off'
        water_level_area_filepath: null
    - id: s150_hold
      labels:
        scene: S150
        oht: 150
        load_tph: 3120
        area_policy: hold
      params:
        filepath: experiments/maps/small_150.xlsx
        oht_nums: 150
        area_control_policy: fixed_water_level_hold
        water_level_area_filepath: experiments/areas/small_150_areas.xlsx
    - id: s150_rebalance
      labels:
        scene: S150
        oht: 150
        load_tph: 3120
        area_policy: rebalance
      params:
        filepath: experiments/maps/small_150.xlsx
        oht_nums: 150
        area_control_policy: fixed_water_level_rebalance
        water_level_area_filepath: experiments/areas/small_150_areas.xlsx
    - id: m175_off
      labels:
        scene: M175
        oht: 175
        load_tph: 4850
        area_policy: false
      params:
        filepath: experiments/maps/medium_175.xlsx
        oht_nums: 175
        loop_length_bound: 45
        area_control_policy: 'off'
        water_level_area_filepath: null
    - id: m175_hold
      labels:
        scene: M175
        oht: 175
        load_tph: 4850
        area_policy: hold
      params:
        filepath: experiments/maps/medium_175.xlsx
        oht_nums: 175
        loop_length_bound: 45
        area_control_policy: fixed_water_level_hold
        water_level_area_filepath: experiments/areas/medium_175_areas.xlsx
    - id: m175_rebalance
      labels:
        scene: M175
        oht: 175
        load_tph: 4850
